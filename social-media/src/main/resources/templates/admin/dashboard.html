<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <th:block th:replace="~{fragments/common/commonHead :: commonHead}"></th:block>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div th:replace="~{fragments/common/header :: header}"></div>
<div class="row">
  <!-- Sidebar -->
  <th:block th:replace="~{fragments/sidebar :: sidebar}" />

  <!-- Main Content -->
  <div class="col-md-10 col-lg-10 p-4">
    <h2 class="mb-4"><i class="fa-solid fa-gauge-high"></i> Admin Dashboard</h2>

    <!-- Stats charts -->
    <div class="row mb-4">

      <!-- Người dùng mới -->
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="text-center"><i class="fa-solid fa-user-plus text-success"></i> Người dùng mới</h5>
            <canvas id="userChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>


<!-- Đẩy dữ liệu từ Thymeleaf vào JS -->
<script th:inline="javascript">
  const visitStats = {
    week: /*[[${visitStats['week']}]]*/,
    month: /*[[${visitStats['month']}]]*/,
    today: /*[[${visitStats['today']}]]*/
  };

  const newUserStats = {
    week: /*[[${newUserStats['week']}]]*/,
    month: /*[[${newUserStats['month']}]]*/,
    today: /*[[${newUserStats['today']}]]*/
  };
</script>

<script>
  // Chart người dùng mới
  new Chart(document.getElementById('userChart'), {
    type: 'bar',
    data: {
      labels: ['Tuần', 'Tháng', 'Hôm nay'],
      datasets: [{
        label: 'Người dùng mới',
        data: [newUserStats.week, newUserStats.month, newUserStats.today],
        backgroundColor: ['#FF6384','#FF9F40','#FFCD56']
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1,
            precision: 0
          }
        }
      }
    }
  });
</script>

</body>
</html>
