<a class="dropdown-item d-flex align-items-center" [routerLink]="['/profile', (user$ | async)?.username]">
        <img [src]="(user$ | async)?.avatarUrl || '/images/default-avatar.jpg'" alt="Avatar" class="rounded-circle nav-icon-wrapper"/>
        <span class="ms-2">{{ (user$ | async)?.fullName }}</span>
      </a>
