<div class="sticky top-16 p-4">
  <div class="bg-white rounded-2xl shadow-sm p-4">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-semibold text-gray-900">Người liên hệ</h3>
      <div class="flex gap-3 text-gray-500">
        <i class="fas fa-comment-dots cursor-pointer hover:text-blue-600"></i>
        <i class="fas fa-users cursor-pointer hover:text-blue-600"></i>
      </div>
    </div>

    <div class="space-y-1">
      <div *ngFor="let contact of contacts" 
           class="flex items-center gap-3 px-3 py-2 hover:bg-gray-100 rounded-xl cursor-pointer group">
        
        <div class="relative">
          <img [src]="contact.avatar" 
               [alt]="contact.name"
               class="w-10 h-10 rounded-full object-cover">
          <div *ngIf="contact.online" 
               class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
        </div>
        
        <p class="font-medium text-gray-900 group-hover:underline">{{ contact.name }}</p>
      </div>
    </div>
  </div>
</div>
